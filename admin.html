<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Seedance</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white min-h-screen grid place-items-center p-6"><div id="loginBox" class="bg-zinc-900 border border-white/10 p-6 rounded-2xl w-full max-w-sm text-center"><h1 class="font-bold text-xl">Owner Admin</h1><p class="text-sm text-zinc-400">Master Password dalo</p><input id="pass" type="password" placeholder="Password" class="w-full mt-4 bg-black border border-white/10 rounded-lg p-3 text-sm"><button onclick="check()" class="w-full mt-3 bg-violet-600 py-3 rounded-xl font-bold">Unlock</button><p class="text-xs text-zinc-600 mt-3">Default Password: Owner@2025</p></div><div id="panel" class="hidden bg-zinc-900 border border-white/10 p-6 rounded-2xl w-full max-w-lg"><h2 class="font-bold">License Generator</h2><button onclick="gen()" class="mt-4 bg-white text-black px-6 py-3 rounded-xl font-bold">Generate License Key</button><div id="out" class="mt-4 bg-black p-4 rounded-xl text-xs font-mono break-all text-emerald-400">Key yahan ayegi...</div><input id="keyInput" placeholder="Key paste karo" class="w-full mt-4 bg-black border border-white/10 rounded-lg p-3 text-xs"><button onclick="activate()" class="w-full mt-2 bg-violet-600 py-3 rounded-lg text-sm font-bold">Activate Device Lock</button><p class="text-xs text-zinc-500 mt-3">1 Key = 1 Domain/Device. Buyer dusri jagah use nahi kar payega.</p></div><script>const MASTER="Owner@2025";function check(){if(document.getElementById(\'pass\').value===MASTER){loginBox.classList.add(\'hidden\');panel.classList.remove(\'hidden\')}else alert("Galat Password")}function gen(){const k=\'SEED-\'+Math.random().toString(36).toUpperCase().slice(2,8)+\'-\'+Date.now().toString(36).toUpperCase();out.textContent=k}function activate(){const k=keyInput.value.trim();if(!k)return alert("Key dalo");localStorage.setItem(\'seedance_license\',k);localStorage.setItem(\'seedance_domain\',location.hostname);alert(\'Lock ho gaya! Domain: \'+location.hostname)}</script></body></html>
