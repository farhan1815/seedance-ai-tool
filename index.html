<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seedance AI</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"><style>body{font-family:sans-serif}</style></head><body class="bg-[#0A0A0B] text-white"><nav class="p-4 flex justify-between items-center border-b border-white/10"><div class="font-bold">SEEDANCE AI</div><button id="loginBtn" class="bg-white text-black px-4 py-2 rounded-full text-sm">Login with Gmail</button><button id="logoutBtn" class="hidden bg-zinc-800 px-4 py-2 rounded-full text-sm">Logout</button></nav><div class="max-w-7xl mx-auto p-4 grid lg:grid-cols-2 gap-6 pt-8"><div class="bg-[#141416] border border-white/10 rounded-2xl p-5"><h2 class="font-bold">Create Video</h2><textarea id="prompt" rows="4" placeholder="A cinematic drone shot of futuristic city at sunset..." class="w-full mt-3 bg-black border border-white/10 rounded-xl p-3 text-sm"></textarea><div class="grid grid-cols-5 gap-2 mt-4" id="styleGrid"></div><div class="flex gap-2 mt-4" id="ratioGrid"></div><button id="generateBtn" class="w-full mt-6 bg-gradient-to-r from-violet-600 to-indigo-600 py-3 rounded-xl font-bold">Generate Video - 1 Credit</button><p class="text-xs text-zinc-500 text-center mt-2">Free trial: 2 videos free</p></div><div class="bg-[#141416] border border-white/10 rounded-2xl p-5"><div id="videoBox" class="bg-black rounded-2xl aspect-video grid place-items-center relative overflow-hidden"><div id="emptyState" class="text-center text-zinc-500 text-sm">Your video will appear here</div><div id="progressState" class="hidden absolute inset-0 bg-black/80 grid place-items-center p-4 text-center"><div><div class="w-12 h-12 border-4 border-violet-600 border-t-transparent rounded-full animate-spin mx-auto"></div><p class="mt-3">Generating... <span id="progressText">0%</span></p><div class="w-full bg-zinc-800 h-2 rounded-full mt-2"><div id="progressBar" class="h-full bg-violet-600" style="width:0%"></div></div></div></div><video id="resultVideo" class="hidden w-full h-full" controls></video></div><button id="downloadBtn" class="hidden w-full mt-4 bg-white text-black py-3 rounded-xl font-bold">Download Without Watermark</button></div></div><p class="text-center text-xs text-zinc-600 py-10"><a href="admin.html">Admin</a></p><script>let s="Cinematic",r="16:9",c=50,t=parseInt(localStorage.getItem(\'trialLeft\')??\'2\'),q=[],g=!1,cu=null;const styles=["Cinematic","Anime","Realistic","3D","Cartoon"],ratios=["16:9","9:16","1:1","4:3","21:9"];const sg=document.getElementById(\'styleGrid\');styles.forEach(x=>{let b=document.createElement(\'button\');b.textContent=x;b.className="p-2 bg-black border border-white/10 rounded-lg text-xs "+(x==s?"border-violet-600":"");b.onclick=()=>{s=x;[...sg.children].forEach(c=>c.classList.remove(\'border-violet-600\'));b.classList.add(\'border-violet-600\')};sg.appendChild(b)});const rg=document.getElementById(\'ratioGrid\');ratios.forEach(x=>{let b=document.createElement(\'button\');b.textContent=x;b.className="px-3 py-1 bg-zinc-800 rounded-full text-xs "+(x==r?"bg-white text-black":"");b.onclick=()=>{r=x;[...rg.children].forEach(c=>c.className="px-3 py-1 bg-zinc-800 rounded-full text-xs");b.className="px-3 py-1 bg-white text-black rounded-full text-xs"};rg.appendChild(b)});document.getElementById(\'loginBtn\').onclick=()=>{let e=prompt("Demo Login - Gmail likho:");if(!e)return;cu={email:e,uid:btoa(e)};c=parseInt(localStorage.getItem(\'credits_\'+cu.uid)??\'50\');alert("Login ho gaya: "+e+" | Credits: "+c);document.getElementById(\'loginBtn\').classList.add(\'hidden\');document.getElementById(\'logoutBtn\').classList.remove(\'hidden\')};document.getElementById(\'logoutBtn\').onclick=()=>{cu=null;document.getElementById(\'loginBtn\').classList.remove(\'hidden\');document.getElementById(\'logoutBtn\').classList.add(\'hidden\')};document.getElementById(\'generateBtn\').onclick=()=>{let p=document.getElementById(\'prompt\').value.trim();if(!p)return alert("Prompt likho!");if(cu){if(c<=0)return alert("Credit khatam! Logout karke nayi Gmail se login karo")}else{if(t<=0)return alert("Free trial khatam! Login karo")} q.push(p);if(!g)process()};function process(){if(q.length==0){g=!1;return}g=!0;if(cu){c--;localStorage.setItem(\'credits_\'+cu.uid,c)}else{t--;localStorage.setItem(\'trialLeft\',t)}document.getElementById(\'emptyState\').classList.add(\'hidden\');document.getElementById(\'progressState\').classList.remove(\'hidden\');let pr=0;let it=setInterval(()=>{pr+=Math.random()*5+2;if(pr>100)pr=100;document.getElementById(\'progressBar\').style.width=pr+"%";document.getElementById(\'progressText\').textContent=Math.floor(pr)+"%";if(pr>=100){clearInterval(it);let v=document.getElementById(\'resultVideo\');v.src="https://videos.pexels.com/video-files/1409899/1409899-uhd_2560_1440_30fps.mp4";v.classList.remove(\'hidden\');document.getElementById(\'progressState\').classList.add(\'hidden\');document.getElementById(\'downloadBtn\').classList.remove(\'hidden\');q.shift();setTimeout(process,1000)}},600)};document.getElementById(\'downloadBtn\').onclick=()=>{let v=document.getElementById(\'resultVideo\');let a=document.createElement(\'a\');a.href=v.src;a.download="seedance.mp4";a.click()}; </script></body></html>
