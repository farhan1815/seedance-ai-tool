g=!1,cu=null;const styles=["Cinematic","Anime","Realistic","3D","Cartoon"],ratios=["16:9","9:16","1:1","4:3","21:9"];const sg=document.getElementById(\'styleGrid\');styles.forEach(x=>{let b=document.createElement(\'button\');b.textContent=x;b.className="p-2 bg-black border border-white/10 rounded-lg text-xs "+(x==s?"border-violet-600":"");b.onclick=()=>{s=x;[...sg.children].forEach(c=>c.classList.remove(\'border-violet-600\'));b.classList.add(\'border-violet-600\')};sg.appendChild(b)});const rg=document.getElementById(\'ratioGrid\');ratios.forEach(x=>{let b=document.createElement(\'button\');b.textContent=x;b.className="px-3 py-1 bg-zinc-800 rounded-full text-xs "+(x==r?"bg-white text-black":"");b.onclick=()=>{r=x;[...rg.children].forEach(c=>c.className="px-3 py-1 bg-zinc-800 rounded-full text-xs");b.className="px-3 py-1 bg-white text-black rounded-full text-xs"};rg.appendChild(b)});charRef.onchange=e=>charName.textContent=e.target.files.length?e.target.files.length+" images":"";videoRef.onchange=e=>videoName.textContent=e.target.files[0]?.name||"";loginBtn.onclick=()=>{let e=prompt("Gmail likho:");if(!e)return;cu={email:e,uid:btoa(e)};c=parseInt(localStorage.getItem(\'credits_\'+cu.uid)??\'50\');loginBtn.classList.add(\'hidden\');logoutBtn.classList.remove(\'hidden\');creditBadge.classList.remove(\'hidden\');creditCount.textContent=c;alert("Login: "+e)};logoutBtn.onclick=()=>{cu=null;loginBtn.classList.remove(\'hidden\');logoutBtn.classList.add(\'hidden\');creditBadge.classList.add(\'hidden\')};generateBtn.onclick=()=>{let p=prompt.value.trim();if(!p)return alert("Prompt likho");if(cu){if(c<=0)return alert("Credit khatam")}else{if(t<=0)return alert("Free trial khatam")}q.push(p);if(!g)process()};function process(){if(q.length==0){g=!1;return}g=!0;if(cu){c--;localStorage.setItem(\'credits_\'+cu.uid,c);creditCount.textContent=c}else{t--;localStorage.setItem(\'trialLeft\',t)}emptyState.classList.add(\'hidden\');progressState.classList.remove(\'hidden\');let pr=0;let it=setInterval(()=>{pr+=Math.random()*5+2;if(pr>100)pr=100;progressBar.style.width=pr+"%";progressText.textContent=Math.floor(pr)+"%";if(pr>=100){clearInterval(it);resultVideo.src="https://videos.pexels.com/video-files/1409899/1409899-uhd_2560_1440_30fps.mp4";resultVideo.classList.remove(\'hidden\');progressState.classList.add(\'hidden\');downloadBtn.classList.remove(\'hidden\');q.shift();setTimeout(process,800)}},600)};downloadBtn.onclick=()=>{let a=document.createElement(\'a\');a.href=resultVideo.src;a.download="seedance.mp4";a.click()};</script></body></html>
